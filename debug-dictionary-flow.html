<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>词典数据流调试工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .debug-section {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .code {
            background: #f1f3f4;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 8px 0;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .step {
            background: #e9ecef;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #007AFF;
        }
    </style>
</head>
<body>
    <h1>🔍 词典数据流调试工具</h1>
    
    <div class="status warning">
        <strong>问题：</strong>自建词典勾选了但还是显示"文本高亮已禁用"
    </div>

    <div class="debug-section">
        <h2>📋 调试步骤</h2>
        
        <div class="step">
            <h3>步骤1：检查Storage数据</h3>
            <button onclick="checkStorage()">检查Chrome Storage</button>
            <div id="storage-result" class="code"></div>
        </div>

        <div class="step">
            <h3>步骤2：检查DictionaryAdapter状态</h3>
            <button onclick="checkAdapter()">检查适配器状态</button>
            <div id="adapter-result" class="code"></div>
        </div>

        <div class="step">
            <h3>步骤3：检查词典数据</h3>
            <button onclick="checkDictionaryData()">检查词典内容</button>
            <div id="dictionary-result" class="code"></div>
        </div>

        <div class="step">
            <h3>步骤4：检查启用状态</h3>
            <button onclick="checkEnabledStatus()">检查启用状态</button>
            <div id="enabled-result" class="code"></div>
        </div>

        <div class="step">
            <h3>步骤5：模拟消息传递</h3>
            <button onclick="simulateMessage()">模拟updateDictSettings消息</button>
            <div id="message-result" class="code"></div>
        </div>

        <div class="step">
            <h3>步骤6：检查IndexedDB</h3>
            <button onclick="checkIndexedDB()">检查自建词典数据</button>
            <div id="indexeddb-result" class="code"></div>
        </div>
    </div>

    <div class="debug-section">
        <h2>🔧 实时监控</h2>
        <button onclick="startMonitoring()">开始监控</button>
        <button onclick="stopMonitoring()">停止监控</button>
        <div id="monitor-result" class="code"></div>
    </div>

    <script>
        let monitorInterval = null;

        // 检查Chrome Storage
        async function checkStorage() {
            const resultDiv = document.getElementById('storage-result');
            try {
                const result = await chrome.storage.local.get(['dictSettings', 'enabled']);
                resultDiv.textContent = '=== Chrome Storage 数据 ===\n' + 
                    JSON.stringify(result, null, 2);
            } catch (error) {
                resultDiv.textContent = '错误: ' + error.message;
            }
        }

        // 检查DictionaryAdapter状态
        function checkAdapter() {
            const resultDiv = document.getElementById('adapter-result');
            
            if (typeof window.adhdHighlighter !== 'undefined' && window.adhdHighlighter.dictionaryManager) {
                const adapter = window.adhdHighlighter.dictionaryManager;
                
                const info = {
                    isReady: adapter.isReady(),
                    isLoaded: adapter.isLoaded,
                    hasNewManager: !!adapter.newManager,
                    enabledLanguages: adapter.enabledLanguages,
                    enabledDictionaries: adapter.enabledDictionaries,
                    legacyDataKeys: Object.keys(adapter.legacyData),
                    statistics: adapter.getStatistics()
                };
                
                resultDiv.textContent = '=== DictionaryAdapter 状态 ===\n' + 
                    JSON.stringify(info, null, 2);
            } else {
                resultDiv.textContent = '错误: adhdHighlighter 未初始化';
            }
        }

        // 检查词典数据
        function checkDictionaryData() {
            const resultDiv = document.getElementById('dictionary-result');
            
            if (typeof window.adhdHighlighter !== 'undefined' && window.adhdHighlighter.dictionaryManager) {
                const adapter = window.adhdHighlighter.dictionaryManager;
                
                const zhDict = adapter.getDictionary('zh');
                const enDict = adapter.getDictionary('en');
                
                const info = {
                    zhDictSize: Object.keys(zhDict).length,
                    enDictSize: Object.keys(enDict).length,
                    zhSample: Object.keys(zhDict).slice(0, 10),
                    enSample: Object.keys(enDict).slice(0, 10),
                    legacyDataSizes: Object.keys(adapter.legacyData).reduce((acc, lang) => {
                        acc[lang] = Object.keys(adapter.legacyData[lang] || {}).length;
                        return acc;
                    }, {})
                };
                
                resultDiv.textContent = '=== 词典数据 ===\n' + 
                    JSON.stringify(info, null, 2);
            } else {
                resultDiv.textContent = '错误: adhdHighlighter 未初始化';
            }
        }

        // 检查启用状态
        function checkEnabledStatus() {
            const resultDiv = document.getElementById('enabled-result');
            
            if (typeof window.adhdHighlighter !== 'undefined') {
                const highlighter = window.adhdHighlighter;
                const adapter = highlighter.dictionaryManager;
                
                const info = {
                    highlighterEnabled: highlighter.enabled,
                    highlighterInitialized: highlighter.isInitialized,
                    adapterReady: adapter.isReady(),
                    enabledLanguages: adapter.getEnabledLanguages(),
                    languageStatus: adapter.enabledLanguages,
                    dictionaryStatus: adapter.enabledDictionaries
                };
                
                resultDiv.textContent = '=== 启用状态 ===\n' + 
                    JSON.stringify(info, null, 2);
            } else {
                resultDiv.textContent = '错误: adhdHighlighter 未初始化';
            }
        }

        // 模拟消息传递
        async function simulateMessage() {
            const resultDiv = document.getElementById('message-result');
            
            try {
                // 获取当前的dictSettings
                const storageResult = await chrome.storage.local.get(['dictSettings']);
                const dictSettings = storageResult.dictSettings || {};
                
                // 获取自建词典数据
                const customDictionaries = await getCustomDictionariesFromIndexedDB();
                const enabledCustomDicts = customDictionaries.filter(dict => 
                    dict.addedToLibrary && dictSettings[dict.id]
                );
                
                // 模拟发送消息
                const message = {
                    action: 'updateDictSettings',
                    dictSettings: dictSettings,
                    customDictionaries: enabledCustomDicts
                };
                
                resultDiv.textContent = '=== 模拟消息 ===\n' + 
                    '发送的消息:\n' + JSON.stringify(message, null, 2) + '\n\n';
                
                // 如果有highlighter，直接调用方法
                if (typeof window.adhdHighlighter !== 'undefined') {
                    await window.adhdHighlighter.updateDictSettings(dictSettings, enabledCustomDicts);
                    resultDiv.textContent += '消息处理完成\n';
                    
                    // 检查处理后的状态
                    const adapter = window.adhdHighlighter.dictionaryManager;
                    resultDiv.textContent += '处理后状态:\n' + 
                        JSON.stringify({
                            enabledLanguages: adapter.enabledLanguages,
                            enabledDictionaries: adapter.enabledDictionaries
                        }, null, 2);
                }
                
            } catch (error) {
                resultDiv.textContent = '错误: ' + error.message + '\n' + error.stack;
            }
        }

        // 检查IndexedDB
        async function checkIndexedDB() {
            const resultDiv = document.getElementById('indexeddb-result');
            
            try {
                const customDictionaries = await getCustomDictionariesFromIndexedDB();
                
                const info = {
                    totalDictionaries: customDictionaries.length,
                    addedToLibrary: customDictionaries.filter(d => d.addedToLibrary).length,
                    dictionaries: customDictionaries.map(dict => ({
                        id: dict.id,
                        name: dict.name,
                        addedToLibrary: dict.addedToLibrary,
                        wordCount: dict.words ? dict.words.length : 0,
                        sampleWords: dict.words ? dict.words.slice(0, 5).map(w => w.word) : []
                    }))
                };
                
                resultDiv.textContent = '=== IndexedDB 数据 ===\n' + 
                    JSON.stringify(info, null, 2);
            } catch (error) {
                resultDiv.textContent = '错误: ' + error.message;
            }
        }

        // 获取IndexedDB中的自建词典
        function getCustomDictionariesFromIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('CustomDictionaryDB', 1);
                
                request.onerror = () => {
                    resolve([]);
                };
                
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    
                    if (!db.objectStoreNames.contains('dictionaries')) {
                        resolve([]);
                        return;
                    }
                    
                    const transaction = db.transaction(['dictionaries'], 'readonly');
                    const store = transaction.objectStore('dictionaries');
                    const getAllRequest = store.getAll();
                    
                    getAllRequest.onsuccess = () => {
                        resolve(getAllRequest.result || []);
                    };
                    
                    getAllRequest.onerror = () => {
                        reject(new Error('获取IndexedDB数据失败'));
                    };
                };
            });
        }

        // 开始监控
        function startMonitoring() {
            const resultDiv = document.getElementById('monitor-result');
            resultDiv.textContent = '开始监控...\n';
            
            monitorInterval = setInterval(() => {
                const timestamp = new Date().toLocaleTimeString();
                
                if (typeof window.adhdHighlighter !== 'undefined') {
                    const highlighter = window.adhdHighlighter;
                    const adapter = highlighter.dictionaryManager;
                    
                    const status = {
                        time: timestamp,
                        enabled: highlighter.enabled,
                        initialized: highlighter.isInitialized,
                        adapterReady: adapter.isReady(),
                        enabledLangs: adapter.getEnabledLanguages(),
                        enabledDicts: Object.keys(adapter.enabledDictionaries).filter(id => adapter.enabledDictionaries[id])
                    };
                    
                    resultDiv.textContent += JSON.stringify(status) + '\n';
                } else {
                    resultDiv.textContent += `${timestamp}: adhdHighlighter 未初始化\n`;
                }
                
                // 限制日志长度
                const lines = resultDiv.textContent.split('\n');
                if (lines.length > 20) {
                    resultDiv.textContent = lines.slice(-20).join('\n');
                }
            }, 2000);
        }

        // 停止监控
        function stopMonitoring() {
            if (monitorInterval) {
                clearInterval(monitorInterval);
                monitorInterval = null;
                document.getElementById('monitor-result').textContent += '监控已停止\n';
            }
        }

        // 页面加载时自动检查
        document.addEventListener('DOMContentLoaded', () => {
            console.log('词典数据流调试工具加载完成');
            
            // 延迟自动检查
            setTimeout(() => {
                checkStorage();
                checkAdapter();
            }, 2000);
        });
    </script>
</body>
</html>
