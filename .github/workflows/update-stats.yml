name: Update Download Statistics

on:
  # 定时执行：每12小时执行一次（东八区时间）
  # 注意：GitHub Actions 使用 UTC 时间，所以需要减去 8 小时
  # 每12小时执行：00:00, 12:00（东八区时间对应UTC 16:00, 04:00）
  schedule:
    - cron: '0 16,4 * * *'  # 每12小时执行
  
  # 手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: '手动更新原因'
        required: false
        default: '手动触发统计更新'

# 权限设置
permissions:
  contents: write  # 需要写入权限来提交更新的 stats.json
  actions: read

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # 2. 设置 Node.js 环境
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Wrangler 需要 Node.js v20+
          # 暂时移除缓存，因为没有 package-lock.json
      
      # 3. 安装 wrangler（全局安装）
      - name: 📦 Install Wrangler
        run: |
          echo "📦 全局安装 wrangler..."
          npm install -g wrangler@latest
          echo "✅ wrangler 安装完成"
          wrangler --version
      
      # 4. 配置 Git 用户信息
      - name: ⚙️ Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      # 5. 创建 wrangler.toml 配置
      - name: 🔧 Create Wrangler Config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "🔧 创建 wrangler.toml 配置文件..."
          
          # 验证必需的环境变量
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ 错误: CLOUDFLARE_API_TOKEN 未设置"
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ 错误: CLOUDFLARE_ACCOUNT_ID 未设置"
            exit 1
          fi
          
          if [ -z "$DATABASE_ID" ]; then
            echo "❌ 错误: DATABASE_ID 未设置"
            exit 1
          fi
          
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "❌ 错误: ADMIN_TOKEN 未设置"
            exit 1
          fi
          
          # 创建 wrangler.toml 文件
          cat > workers/plugin-download-data-worker/wrangler.toml << EOF
          # Cloudflare Workers 配置文件 - GitHub Actions 自动生成
          # ADHDGoFly 下载统计服务
          
          name = "plugin-download-data-worker"
          main = "index.js"
          compatibility_date = "2024-01-01"
          
          # D1 数据库绑定
          [[d1_databases]]
          binding = "DB"
          database_name = "plugin-download-data-database"
          database_id = "$PLUGIN_DOWNLOAD_DATABASE_ID"
          
          # 环境变量
          [vars]
          ADMIN_TOKEN = "$ADMIN_TOKEN"
          EOF
          
          echo "✅ wrangler.toml 配置文件创建完成"
      
      # 6. 获取统计数据
      - name: 📊 Fetch Download Statistics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 开始获取下载统计数据..."
          echo "⏰ 执行时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"
          
          echo "🔐 Cloudflare 认证信息已配置"
          
          # 运行统计脚本
          echo "📈 执行统计查询..."
          node scripts/fetch-stats.js
          
          echo "✅ 统计数据获取完成"
      
      # 7. 检查是否有变更
      - name: 🔍 Check for Changes
        id: check_changes
        run: |
          if git diff --quiet public/stats.json; then
            echo "📊 统计数据无变化"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "📊 检测到统计数据变化"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # 显示变更内容
            echo "📋 变更详情:"
            git diff public/stats.json || true
          fi
      
      # 8. 提交变更（仅在有变化时）
      - name: 💾 Commit Statistics Update
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          # 添加文件到暂存区
          git add public/stats.json
          
          # 生成提交信息
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          COMMIT_MSG="📊 自动更新下载统计数据 - $BEIJING_TIME"
          
          # 如果是手动触发，添加原因
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REASON="${{ github.event.inputs.reason }}"
            if [ -n "$REASON" ]; then
              COMMIT_MSG="$COMMIT_MSG ($REASON)"
            fi
          fi
          
          # 提交变更
          git commit -m "$COMMIT_MSG"
          
          echo "✅ 统计数据已提交"
          echo "📝 提交信息: $COMMIT_MSG"
      
      # 9. 推送到仓库（仅在有变化时）
      - name: 🚀 Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "📤 推送统计数据更新..."
          git push origin main
          echo "✅ 推送完成"
      
      # 10. 输出统计摘要
      - name: 📋 Output Statistics Summary
        if: always()
        run: |
          echo "📊 === 统计数据摘要 ==="
          
          if [ -f "public/stats.json" ]; then
            # 使用 jq 解析 JSON（如果可用）
            if command -v jq >/dev/null 2>&1; then
              echo "📈 总下载量: $(jq -r '.data.totalDownloads // "N/A"' public/stats.json)"
              echo "👥 独立用户: $(jq -r '.data.uniqueUsers // "N/A"' public/stats.json)"
              echo "📅 今日下载: $(jq -r '.data.todayDownloads // "N/A"' public/stats.json)"
              echo "🕐 更新时间: $(jq -r '.lastUpdated // "N/A"' public/stats.json)"
            else
              echo "📄 统计文件已生成: public/stats.json"
              echo "📏 文件大小: $(wc -c < public/stats.json) bytes"
            fi
          else
            echo "❌ 统计文件未找到"
          fi
          
          echo "⏰ 任务完成时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S %Z')"

  # 可选：部署任务（如果需要自动部署）
  deploy:
    needs: update-stats
    runs-on: ubuntu-latest
    if: needs.update-stats.outputs.has_changes == 'true'
    
    steps:
      - name: 📥 Checkout Updated Code
        uses: actions/checkout@v4
        with:
          ref: main  # 确保获取最新的提交
      
      - name: 🚀 Trigger Deployment
        run: |
          echo "🎯 统计数据已更新，可以在这里添加部署逻辑"
          echo "例如：触发 Cloudflare Pages 部署、Netlify 部署等"
          
          # 示例：如果使用 Cloudflare Pages，可以通过 API 触发部署
          # curl -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments" \
          #   -H "Authorization: Bearer $CF_API_TOKEN" \
          #   -H "Content-Type: application/json"