name = "adhdgofly-plugin-analytics"
main = "index.js"
compatibility_date = "2025-10-21"
compatibility_flags = ["nodejs_compat"]

# 生产环境配置
[env.production]
name = "adhdgofly-plugin-analytics-prod"

# 开发环境配置
[env.dev]
name = "adhdgofly-plugin-analytics-dev"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "adhdgofly-plugin-analytics"
database_id = "f748fab1-4742-463a-9b01-3aa4582a1fe6"

[env.production.d1_databases]
binding = "DB"
database_name = "adhdgofly-plugin-analytics-prod"
database_id = "your-prod-d1-database-id"

[env.dev.d1_databases]
binding = "DB"
database_name = "adhdgofly-plugin-analytics-dev"
database_id = "your-dev-d1-database-id"

# 环境变量
[vars]
ENVIRONMENT = "development"
WORKER_AUTH_TOKEN = "b70f4407baee2d0f2ff60b931e019c53dfe40db292e3bd3322272dc57751c023"
CORS_ORIGINS = "*"

[env.production.vars]
ENVIRONMENT = "production"
WORKER_AUTH_TOKEN = "your-prod-auth-token"
CORS_ORIGINS = "https://adhdgofly.com,https://www.adhdgofly.com"

[env.dev.vars]
ENVIRONMENT = "development"
WORKER_AUTH_TOKEN = "your-dev-auth-token"
CORS_ORIGINS = "*"