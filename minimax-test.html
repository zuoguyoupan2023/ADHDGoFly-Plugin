<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMax 测试</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fafafa;color:#222;margin:0;padding:24px}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
label{min-width:96px}
input,select,textarea,button{font-size:14px}
input,select,textarea{padding:8px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#222}
textarea{width:100%;min-height:120px}
button{height:36px;padding:0 16px;border:1px solid #333;border-radius:6px;background:#333;color:#fff}
.btn-secondary{background:#fff;color:#333}
.log{margin-top:16px;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;max-height:60vh;overflow:auto}
.msg{display:flex;gap:8px;padding:8px;border-bottom:1px dashed #eee}
.msg:last-child{border-bottom:0}
.badge{display:inline-block;border:1px solid #ddd;color:#555;background:#f6f6f6;border-radius:6px;padding:0 6px;font-size:12px}
.role{min-width:42px}
.content{flex:1;white-space:pre-wrap;word-break:break-word}
.inline{display:inline-block;margin-left:8px}
</style>
</head>
<body>

<div class="row"><label>API Key</label><input id="key" placeholder="在此粘贴 MiniMax Key" style="flex:1"></div>
<div class="row"><label>供应商URL</label><select id="base">
  <option value="https://api.minimaxi.com/v1">国内 https://api.minimaxi.com/v1</option>
  <option value="https://api.minimax.io/v1">国际 https://api.minimax.io/v1</option>
</select></div>
<div class="row"><label>模型</label><input id="model" value="MiniMax-M2" style="flex:1"></div>
<div class="row"><label>流式</label><input id="stream" type="checkbox" checked><span class="inline badge">reasoning_split=true</span></div>
<div class="row"><label>消息</label></div>
<textarea id="prompt" placeholder="输入你的问题"></textarea>
<div class="row">
  <button id="send">发送</button>
  <button id="clear" class="btn-secondary">清空上下文</button>
</div>

<div class="log" id="log"></div>

<script>
const keyEl=document.getElementById('key');
const baseEl=document.getElementById('base');
const modelEl=document.getElementById('model');
const streamEl=document.getElementById('stream');
const promptEl=document.getElementById('prompt');
const sendBtn=document.getElementById('send');
const clearBtn=document.getElementById('clear');
const logEl=document.getElementById('log');
let messages=[];
function addMsg(role,content,meta){const row=document.createElement('div');row.className='msg';const roleEl=document.createElement('span');roleEl.className='role badge';roleEl.textContent=role.toUpperCase();const metaEl=document.createElement('span');metaEl.className='badge';metaEl.textContent=meta||'';const contentEl=document.createElement('div');contentEl.className='content';contentEl.textContent=content||'';row.appendChild(roleEl);if(meta){row.appendChild(metaEl);}row.appendChild(contentEl);logEl.appendChild(row);logEl.scrollTop=logEl.scrollHeight;}
function addStreamRow(meta){const row=document.createElement('div');row.className='msg';const roleEl=document.createElement('span');roleEl.className='role badge';roleEl.textContent='ASSISTANT';const metaEl=document.createElement('span');metaEl.className='badge';metaEl.textContent=meta||'';const contentEl=document.createElement('div');contentEl.className='content';row.appendChild(roleEl);if(meta){row.appendChild(metaEl);}row.appendChild(contentEl);logEl.appendChild(row);logEl.scrollTop=logEl.scrollHeight;return contentEl;}
async function sendOnce(){const key=(keyEl.value||'').trim();const base=(baseEl.value||'').trim();const model=(modelEl.value||'').trim();const q=(promptEl.value||'').trim();if(!key){alert('缺少 API Key');return;}if(!q){return;}messages.push({role:'user',content:q});addMsg('user',q);promptEl.value='';const useStream=!!streamEl.checked;const url=base+'/chat/completions';const headers={'Content-Type':'application/json','Authorization':'Bearer '+key};if(useStream){let streamText='';let finalMsg=null;let lastReasoning=null;const body=JSON.stringify({model,messages,stream:true,reasoning_split:true});let resp;try{resp=await fetch(url,{method:'POST',headers,body});}catch(e){addMsg('assistant',String(e)||'网络错误');return;}if(!resp.ok){let t='';try{t=await resp.text();}catch{}addMsg('assistant',t||('HTTP '+resp.status));return;}const reader=resp.body.getReader();const decoder=new TextDecoder('utf-8');const contentEl=addStreamRow(('minimax/'+model));let buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){const s=line.trim();if(!s)continue;const payload=s.startsWith('data:')?s.slice(5).trim():s;if(!payload||payload==='[DONE]')continue;let delta='';let j=null;try{j=JSON.parse(payload);}catch{}if(j){delta=(j.choices&&j.choices[0]&&(j.choices[0].delta&&j.choices[0].delta.content))||(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||j.output_text||j.content||'';if(!finalMsg&&j.choices&&j.choices[0]&&j.choices[0].message)finalMsg=j.choices[0].message;try{const rd=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.reasoning_details)||j.reasoning_details||null;if(rd)lastReasoning=rd;}catch{} } else {delta=payload;}if(delta){streamText+=delta;contentEl.textContent=streamText;}}}
if(!finalMsg&&lastReasoning)finalMsg={reasoning_details:lastReasoning};messages.push({role:'assistant',content:streamText});return;}
const body=JSON.stringify({model,messages,reasoning_split:true});let resp;try{resp=await fetch(url,{method:'POST',headers,body});}catch(e){addMsg('assistant',String(e)||'网络错误');return;}let text='';if(!resp.ok){try{text=await resp.text();}catch{}addMsg('assistant',text||('HTTP '+resp.status));return;}let data=null;try{data=await resp.json();}catch{}if(data){const ch=data.choices&&data.choices[0];text=(ch&&ch.message&&ch.message.content)||data.output_text||data.content||'';}messages.push({role:'assistant',content:text});addMsg('assistant',text,('minimax/'+model));}
sendBtn.addEventListener('click',()=>{sendOnce();});
clearBtn.addEventListener('click',()=>{messages=[];logEl.innerHTML='';});
</script>
</body>
</html>
